<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="admin-container" class="admin-panel">
        <div class="admin-heading">
          <div>
            <h3>Activity Administration</h3>
            <p>Create and manage activities.</p>
          </div>
          <button id="admin-toggle" class="secondary-button" type="button">Show Admin</button>
        </div>
        <div id="admin-content" class="hidden">
          <form id="activity-form" class="admin-form">
            <input type="hidden" id="activity-editing" />
            <div class="form-grid">
              <div class="form-group">
                <label for="activity-name">Activity name</label>
                <input id="activity-name" name="name" required maxlength="100" />
              </div>
              <div class="form-group">
                <label for="activity-category">Category</label>
                <input id="activity-category" name="category" required maxlength="100" />
              </div>
              <div class="form-group">
                <label for="activity-schedule">Schedule</label>
                <input id="activity-schedule" name="schedule" required maxlength="200" />
              </div>
              <div class="form-group">
                <label for="activity-location">Location</label>
                <input id="activity-location" name="location" required maxlength="200" />
              </div>
              <div class="form-group">
                <label for="activity-capacity">Maximum participants</label>
                <input id="activity-capacity" name="max_participants" type="number" min="1" max="1000" required />
              </div>
              <div class="form-group form-group-wide">
                <label for="activity-description">Description</label>
                <textarea id="activity-description" name="description" required maxlength="500" rows="3"></textarea>
              </div>
            </div>
            <div class="admin-actions">
              <button id="activity-submit" type="submit">Add Activity</button>
              <button id="activity-cancel" class="secondary-button" type="button" hidden>Cancel</button>
            </div>
          </form>
          <div id="admin-activities" class="admin-list"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
